<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GP Review List</title>
<style>
:root{--fg:#1f2328;--mut:#5b6470;--bd:#d0d7de;--bg:#f6f7f9;--ac:#1f5fa8;--dan:#b42318;--fs:16px}
*{box-sizing:border-box}
body{margin:0;font:var(--fs)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg)}
body.lp{--fs:20px}
main{max-width:720px;margin:0 auto;padding:12px}
h1{font-size:1.35em;margin:.2em 0 .5em}
.panel,.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
label{display:block;font-weight:600;font-size:.9em;margin:.6em 0 .25em;color:var(--mut)}
input,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:inherit}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--ac);border-color:var(--ac)}
button{font:inherit;font-size:.95em;padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:#fff;color:var(--fg);cursor:pointer;min-height:44px}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.dan{color:var(--dan);border-color:#f0b4ae}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1 1 auto}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chead strong{font-size:1.05em}
.cbtn{display:flex;gap:6px}
.cbtn button{padding:6px 10px;min-height:38px}
.grid2{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.mut{color:var(--mut);font-size:.9em}
.empty{text-align:center;color:var(--mut);padding:24px}
#printView{display:none}
@media print{
 @page{size:A4;margin:14mm 12mm 16mm 12mm;@bottom-right{content:"Page " counter(page) " of " counter(pages);font-size:9pt}}
 body{background:#fff;font-size:11pt}
 body.lp{font-size:14pt}
 #app{display:none!important}
 #printView{display:block}
 .ph h1{font-size:16pt;margin:0 0 2mm}
 .ph p{margin:0 0 4mm;font-size:10pt;color:#333}
 table{width:100%;border-collapse:collapse;table-layout:fixed}
 thead{display:table-header-group}
 tr{break-inside:avoid;page-break-inside:avoid}
 th,td{border:1px solid #555;padding:2mm;vertical-align:top;text-align:left;overflow-wrap:anywhere;white-space:pre-wrap}
 th{background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 col.n{width:7%}col.r{width:9%}col.nm{width:22%}
}
</style></head><body>
<main id="app">
 <h1 id="title">GP Review</h1>
 <section class="panel">
  <label for="due">Due GP review date</label><input type="date" id="due">
  <label for="home">Home / unit (optional)</label><input id="home" placeholder="e.g. Unit name">
 </section>
 <div id="list"></div>
 <div class="row" style="margin-bottom:12px"><button class="pri" id="add">Add resident</button></div>
 <section class="panel">
  <div class="row">
   <button id="print">Print</button><button id="lpBtn">Large print</button>
   <button id="exp">Export backup</button><button id="imp">Import backup</button>
   <button class="dan" id="clear">Clear all</button>
  </div>
  <input type="file" id="file" accept="application/json,.json" hidden>
  <p class="mut" id="status">Saved on this device automatically.</p>
 </section>
</main>
<div id="printView"></div>
<script>
(function(){
var KEY='gp_list_v1',mem=null;
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){if(mem)return mem}return mem||{due:'',home:'',lp:false,items:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));setS('Saved on this device.')}catch(e){mem=st;setS('Could not save to device storage - export a backup.')}}
var st=load();st.items=st.items||[];
var $=function(i){return document.getElementById(i)};
function setS(t){$('status').textContent=t}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(d){if(!d)return '';var p=d.split('-');var dt=new Date(+p[0],p[1]-1,+p[2]);return dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'}).replace(',','')}
function title(){var t='GP Review'+(st.due?' \u2013 due '+fmt(st.due):'');$('title').textContent=t;document.title=t;return t}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function render(){
 var L=$('list');L.innerHTML='';
 if(!st.items.length){L.innerHTML='<div class="card empty">No residents yet. Tap "Add resident".</div>'}
 st.items.forEach(function(it,i){
  var c=document.createElement('div');c.className='card';c.dataset.id=it.id;
  c.innerHTML='<div class="chead"><strong>'+(i+1)+'. '+(esc(it.name)||'New resident')+'</strong><div class="cbtn">'+
  '<button data-a="up" aria-label="Move up"'+(i?'':' disabled')+'>Up</button><button data-a="dn" aria-label="Move down"'+(i<st.items.length-1?'':' disabled')+'>Down</button><button class="dan" data-a="del">Delete</button></div></div>'+
  '<div class="grid2"><div><label>Room</label><input data-f="room" inputmode="numeric" value="'+esc(it.room)+'"></div><div><label>Resident name</label><input data-f="name" value="'+esc(it.name)+'"></div></div>'+
  '<label>Concerns</label><textarea data-f="concerns">'+esc(it.concerns)+'</textarea>'+
  '<label>Comments by GP</label><textarea data-f="gp">'+esc(it.gp)+'</textarea>';
  L.appendChild(c)});
 buildPrint();
}
function buildPrint(){
 var t=title(),hasRoom=st.items.some(function(x){return (x.room||'').trim()});
 var h='<div class="ph"><h1>'+esc(t)+'</h1><p>'+(st.home?esc(st.home)+' &middot; ':'')+'Printed '+esc(new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'}).replace(',',''))+' &middot; '+st.items.length+' resident'+(st.items.length==1?'':'s')+'</p></div>';
 h+='<table><colgroup><col class="n">'+(hasRoom?'<col class="r">':'')+'<col class="nm"><col><col></colgroup><thead><tr><th>#</th>'+(hasRoom?'<th>Room</th>':'')+'<th>Resident name</th><th>Concerns</th><th>Comments by GP</th></tr></thead><tbody>';
 st.items.forEach(function(it,i){h+='<tr><td>'+(i+1)+'</td>'+(hasRoom?'<td>'+esc(it.room)+'</td>':'')+'<td>'+esc(it.name)+'</td><td>'+esc(it.concerns)+'</td><td>'+esc(it.gp)+'</td></tr>'});
 if(!st.items.length)h+='<tr><td colspan="'+(hasRoom?5:4)+'">No entries</td></tr>';
 $('printView').innerHTML=h+'</tbody></table>';
}
$('list').addEventListener('input',function(e){var f=e.target.dataset.f;if(!f)return;var id=e.target.closest('.card').dataset.id;var it=st.items.find(function(x){return x.id===id});it[f]=e.target.value;
 if(f==='name'){var c=e.target.closest('.card');var i=st.items.indexOf(it);c.querySelector('strong').textContent=(i+1)+'. '+(it.name||'New resident')}save();buildPrint()});
$('list').addEventListener('click',function(e){var a=e.target.dataset.a;if(!a)return;var id=e.target.closest('.card').dataset.id;var i=st.items.findIndex(function(x){return x.id===id});
 if(a==='del'){if(!confirm('Delete '+(st.items[i].name||'this entry')+'?'))return;st.items.splice(i,1)}
 else if(a==='up'&&i>0){st.items.splice(i-1,0,st.items.splice(i,1)[0])}
 else if(a==='dn'&&i<st.items.length-1){st.items.splice(i+1,0,st.items.splice(i,1)[0])}
 save();render()});
$('add').onclick=function(){st.items.push({id:uid(),room:'',name:'',concerns:'',gp:''});save();render();var c=$('list').lastElementChild;c.scrollIntoView({behavior:'smooth'});var n=c.querySelector('[data-f=room]');n&&n.focus()};
$('due').value=st.due||'';$('home').value=st.home||'';
$('due').oninput=function(){st.due=this.value;save();buildPrint()};
$('home').oninput=function(){st.home=this.value;save();buildPrint()};
function lp(){document.body.classList.toggle('lp',!!st.lp);$('lpBtn').textContent=st.lp?'Normal print':'Large print'}
$('lpBtn').onclick=function(){st.lp=!st.lp;save();lp()};
$('print').onclick=function(){buildPrint();window.print()};
window.addEventListener('beforeprint',buildPrint);
$('clear').onclick=function(){if(!confirm('Clear ALL entries and the date? This cannot be undone (export a backup first).'))return;st={due:'',home:'',lp:st.lp,items:[]};$('due').value='';$('home').value='';save();render()};
$('exp').onclick=function(){var b=new Blob([JSON.stringify(st,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gp-review-'+(st.due||'list')+'.json';document.body.appendChild(a);a.click();a.remove()};
$('imp').onclick=function(){$('file').click()};
$('file').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.items))throw 0;if(!confirm('Replace current list with '+d.items.length+' imported entries?'))return;d.items.forEach(function(x){x.id=x.id||uid()});st=d;$('due').value=st.due||'';$('home').value=st.home||'';save();lp();render()}catch(e){alert('That file is not a valid GP list backup.')}};r.readAsText(f);this.value=''};
lp();render();
})();
</script></body></html>
